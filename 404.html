<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="عذراً، الصفحة غير موجودة - FES HealthTech" />
  <title>404 - الصفحة غير موجودة | FES HealthTech</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    /* ════════════════════════════════════════
       FES HealthTech — 404 Error Page CSS
       Clinical Luxury & High-Contrast Readability
       ════════════════════════════════════════ */
    body, html {
      background-color: #F8FAFF !important;
      background: linear-gradient(180deg, #F0F4FF 0%, #F8FAFF 100%) !important;
      color: #374151 !important;
      font-family: var(--font-arabic);
      overflow-x: hidden !important;
      width: 100% !important;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .error-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height) + 60px) 24px 80px;
      position: relative;
      overflow: hidden;
    }
    
    .error-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(37, 99, 235, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 99, 235, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .error-card {
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(37, 99, 235, 0.08) !important;
      border-radius: 28px;
      padding: 60px 40px;
      box-shadow: 0 20px 50px rgba(13, 27, 42, 0.03) !important;
      max-width: 600px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .error-code {
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 950;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #1D4ED8 0%, #0D9488 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      letter-spacing: -0.05em;
    }

    .error-title {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 850;
      color: #0D1B2A !important;
      margin-bottom: 18px;
    }

    .error-desc {
      font-size: 1rem;
      color: #475569 !important;
      line-height: 1.8;
      margin-bottom: 36px;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 12px 24px;
      font-size: 0.92rem;
      border-radius: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="error-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">الصفحة غير موجودة 🔍</h1>
      <p class="error-desc">
        عذراً، الصفحة التي تبحث عنها قد تم نقلها، أو حذفها، أو أنها لم تكن موجودة في المقام الأول. يمكنك العودة للصفحة الرئيسية واستكشاف منتجاتنا وحلولنا السريرية.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary btn-sm">🏠 العودة للرئيسية</a>
        <a href="pages/contact.html" class="btn btn-outline btn-sm">✉️ تواصل معنا</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="components/components.js"></script>
</body>
</html>
